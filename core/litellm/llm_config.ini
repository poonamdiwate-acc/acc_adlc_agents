[appsettings]
# Provider: azureopenai | awsbedrock | gcpvertexai
default_llm_provider = azureopenai
default_model_name = gpt-4.1
use_litellm = true
enable_cost_tracking = true
enable_langfuse = false
num_retries = 3
timeout_seconds = 600

# Langfuse (optional observability)
# langfuse_public_key =
# langfuse_secret_key =
# langfuse_host = https://us.cloud.langfuse.com

[litellm_gateway]
# Set use_proxy = true to route all calls through a centralized LiteLLM proxy
use_proxy = false
proxy_url = http://localhost:4000
model = azure/gpt-4.1
key = sk-your-proxy-master-key

[azure]
# Direct Azure OpenAI credentials (used when use_proxy = false)
api_key = YOUR_AZURE_API_KEY
endpoint = https://your-resource.openai.azure.com
api_version = 2024-12-01-preview
deployment_name = gpt-4.1
model = azure/gpt-4.1
temperature = 0.7

[bedrock]
# AWS Bedrock (uncomment and fill if using)
# model_id = anthropic.claude-3-5-sonnet-20241022-v2:0
# region = us-east-1
# aws_access_key_id = YOUR_AWS_ACCESS_KEY
# aws_secret_access_key = YOUR_AWS_SECRET_KEY

[vertex]
# GCP Vertex AI (uncomment and fill if using)
# model_name = gemini-1.5-pro
# project_id = your-gcp-project
# location = us-central1
